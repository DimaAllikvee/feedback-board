version: '3.8'

services:
  # PocketBase Backend (Database + REST API + Auth)
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: feedback-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # CRITICAL PERSISTENT VOLUME: Prevents data loss upon container recreation
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend Application (React + Vite + Tailwind + Lucide/RuneIcons)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feedback-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_POCKETBASE_URL=http://pocketbase:8090
      - VITE_STRIPE_PUBLIC_KEY=pk_test_sample_51OEXAMPLEKEY0000000000
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  # Persistent volume mapped to host/Coolify storage
  pb_data:
    driver: local
